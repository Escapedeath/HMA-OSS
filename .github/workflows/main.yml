name: Build HMA-OSS 173

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CI: "true"

    steps:
      - name: Checkout oss-173 source
        uses: actions/checkout@v6
        with:
          repository: frknkrc44/HMA-OSS
          ref: oss-173
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Fix version calculation for historical tag
        shell: bash
        run: |
          # The project calculates its version from origin/master.
          # Point this local reference at the selected tag.
          git update-ref refs/remotes/origin/master "$(git rev-parse HEAD)"
          git log -1 --format='%H %s'

          COUNT=$(git rev-list refs/remotes/origin/master --count)
          VERSION=$((COUNT - 432))
          echo "Source version: oss-$VERSION"

          if [ "$VERSION" -ne 173 ]; then
            echo "::error::Expected oss-173, got oss-$VERSION"
            exit 1
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-hma173-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-hma173-gradle-

      - name: Configure build
        shell: bash
        run: |
          chmod +x gradlew

          # Keep the oss-173 version name.
          # Signing uses the project's fallback debug key.
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          officialBuild=true
          EOF

      - name: Prepare build
        run: ./gradlew prebuild --no-daemon --stacktrace

      - name: Build manager APKs
        run: ./gradlew :app:assemble --no-daemon --stacktrace

      - name: Build Zygisk modules
        run: ./gradlew :zygote:assemble --no-daemon --stacktrace

      - name: Collect module files
        shell: bash
        run: |
          mkdir -p artifacts/release artifacts/debug artifacts/manager

          cp zygote/build/outputs/magisk/release/*.zip artifacts/release/
          cp zygote/build/outputs/magisk/debug/*.zip artifacts/debug/
          cp app/build/outputs/apk/release/*.apk artifacts/manager/
          cp app/build/outputs/apk/debug/*.apk artifacts/manager/

          find artifacts -type f -exec sha256sum {} \;

      - name: Upload release module
        uses: actions/upload-artifact@v4
        with:
          name: HMA-OSS-173-release
          path: artifacts/release/*.zip
          if-no-files-found: error

      - name: Upload debug module
        uses: actions/upload-artifact@v4
        with:
          name: HMA-OSS-173-debug
          path: artifacts/debug/*.zip
          if-no-files-found: error

      - name: Upload manager APKs
        uses: actions/upload-artifact@v4
        with:
          name: HMA-OSS-173-manager
          path: artifacts/manager/*.apk
          if-no-files-found: error

      - name: Upload obfuscation mappings
        uses: actions/upload-artifact@v4
        with:
          name: HMA-OSS-173-mappings
          path: |
            app/build/outputs/mapping/release/
            zygote/build/outputs/mapping/release/
          if-no-files-found: warn
